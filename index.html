<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento Reunião VIP - CupomClic</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 30px 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 26px;
      text-align: center;
      margin-top: 0;
      margin-bottom: 8px;
    }

    p.subtitulo {
      text-align: center;
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 25px;
    }

    /* ETAPA 1: SELEÇÃO DE DATA E HORÁRIOS */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    input[type="date"],
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select {
      width: 100%;
      padding: 14px;
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #38bdf8;
    }

    .grid-horarios {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .btn-horario {
      padding: 14px 8px;
      background-color: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-horario:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-horario.ocupado {
      background-color: #1e293b;
      color: #475569;
      text-decoration: line-through;
      border-color: #1e293b;
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* CARD DE CONFIRMAÇÃO DE SELEÇÃO */
    .card-selecionado {
      background-color: #0f172a;
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .card-selecionado .info-data {
      font-size: 15px;
      color: var(--text-muted);
    }

    .card-selecionado .info-destaque {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent);
      margin-top: 4px;
    }

    .btn-alterar {
      background: #334155;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-alterar:hover {
      background: #475569;
    }

    /* ETAPA 2 & 3: FORMULÁRIO E ACEITE LGPD */
    #secaoFormulario {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .box-lgpd {
      margin-top: 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
    }

    .box-lgpd input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
      margin-top: 2px;
    }

    .box-lgpd label {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 0;
      cursor: pointer;
    }

    .box-lgpd a {
      color: #38bdf8;
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 18px;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .btn-submit:disabled {
      background-color: #334155;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .status-msg {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚀 Reunião VIP CupomClic</h1>
    <p class="subtitulo">Escolha o melhor dia e horário para o nosso encontro</p>

    <!-- ETAPA 1: SELEÇÃO DE DATA E HORÁRIO -->
    <div id="secaoSelecao">
      <div class="form-group">
        <label for="dataInput">Selecione a Data:</label>
        <input type="date" id="dataInput">
      </div>

      <div class="form-group">
        <label>Horários Disponíveis:</label>
        <div id="gridHorarios" class="grid-horarios">
          <!-- Botões de horário inseridos dinamicamente -->
        </div>
      </div>
    </div>

    <!-- ETAPA 2: CONFIRMAÇÃO DO HORÁRIO E DADOS DO LOJISTA -->
    <div id="secaoFormulario">
      <!-- Card da escolha do Lojista -->
      <div class="card-selecionado">
        <div>
          <div class="info-data">Horário Escolhido:</div>
          <div class="info-destaque" id="txtResumoSelecao">--/-- às --:--</div>
        </div>
        <button class="btn-alterar" type="button" onclick="alterarHorario()">✏️ Alterar</button>
      </div>

      <form id="formAgendamento">
        <div class="form-group">
          <label for="nome">Seu Nome Completo:</label>
          <input type="text" id="nome" required placeholder="Ex: João Silva">
        </div>

        <div class="form-group">
          <label for="loja">Nome da Sua Loja:</label>
          <input type="text" id="loja" required placeholder="Ex: Mamed Store">
        </div>

        <div class="form-group">
          <label for="whatsapp">WhatsApp (com DDD):</label>
          <input type="tel" id="whatsapp" required placeholder="Ex: 14999999999">
        </div>

        <div class="form-group">
          <label for="email">E-mail Comercial:</label>
          <input type="email" id="email" required placeholder="seuemail@exemplo.com">
        </div>

        <div class="form-group">
          <label for="funcao">Qual sua função na loja?</label>
          <select id="funcao" required>
            <option value="">Selecione...</option>
            <option value="Proprietário(a) / Sócio(a)">Proprietário(a) / Sócio(a)</option>
            <option value="Gerente de Marketing / Vendas">Gerente de Marketing / Vendas</option>
            <option value="Outro">Outro</option>
          </select>
        </div>

        <!-- ACEITE DE DADOS / LGPD -->
        <div class="box-lgpd">
          <input type="checkbox" id="aceiteTermos" required>
          <label for="aceiteTermos">
            Concordo com o uso dos meus dados para o agendamento da reunião e contato da equipe, de acordo com os <a href="/termos.html" target="_blank">Termos de Uso e Privacidade</a>.
          </label>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
          🚀 Confirmar Agendamento
        </button>
      </form>
    </div>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script>
    const HORARIOS_PADRAO = ['09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00'];

    const dataInput = document.getElementById('dataInput');
    const gridHorarios = document.getElementById('gridHorarios');
    const secaoSelecao = document.getElementById('secaoSelecao');
    const secaoFormulario = document.getElementById('secaoFormulario');
    const txtResumoSelecao = document.getElementById('txtResumoSelecao');
    const statusMsg = document.getElementById('statusMsg');
    const form = document.getElementById('formAgendamento');

    let horaSelecionada = null;

    // Define data mínima como hoje
    const hoje = new Date().toISOString().split('T')[0];
    dataInput.value = hoje;
    dataInput.min = hoje;

    async function buscarHorariosOcupados(dataStr) {
      gridHorarios.innerHTML = '<div style="grid-column: span 3; text-align: center; color: #94a3b8; padding: 10px;">Buscando horários...</div>';
      
      try {
        const res = await fetch(`/api/agendar?data=${dataStr}`);
        const data = await res.json();
        const ocupados = data.ocupados || [];

        gridHorarios.innerHTML = '';

        HORARIOS_PADRAO.forEach(hora => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn-horario';
          btn.textContent = hora;

          if (ocupados.includes(hora)) {
            btn.classList.add('ocupado');
            btn.disabled = true;
          } else {
            btn.onclick = () => selecionarHorario(dataStr, hora);
          }

          gridHorarios.appendChild(btn);
        });

      } catch (err) {
        console.error('Erro ao buscar horários:', err);
        gridHorarios.innerHTML = '<div style="grid-column: span 3; text-align: center; color: #ef4444;">Erro ao carregar horários.</div>';
      }
    }

    function selecionarHorario(dataStr, hora) {
      horaSelecionada = hora;

      // Formata a data para exibir (Ex: 24/07/2026)
      const partes = dataStr.split('-');
      const dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`;

      txtResumoSelecao.textContent = `${dataFormatada} às ${hora}h`;

      // Esconde a grade de escolha e mostra o formulário limpo
      secaoSelecao.style.display = 'none';
      secaoFormulario.style.display = 'block';
    }

    function alterarHorario() {
      horaSelecionada = null;
      secaoFormulario.style.display = 'none';
      secaoSelecao.style.display = 'block';
    }

    dataInput.addEventListener('change', (e) => {
      buscarHorariosOcupados(e.target.value);
    });

    // Submissão do Formulário
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const btnSubmit = document.getElementById('btnSubmit');
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Agendando...';
      statusMsg.textContent = '';

      const payload = {
        data: dataInput.value,
        hora: horaSelecionada,
        nome: document.getElementById('nome').value,
        loja: document.getElementById('loja').value,
        whatsapp: document.getElementById('whatsapp').value,
        email: document.getElementById('email').value,
        funcao: document.getElementById('funcao').value
      };

      try {
        const response = await fetch('/api/agendar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          // Redireciona para a sala VIP personalizada do lojista
          window.location.href = result.meetLink;
        } else {
          statusMsg.style.color = '#ef4444';
          statusMsg.textContent = result.error || 'Erro ao realizar agendamento.';
          btnSubmit.disabled = false;
          btnSubmit.textContent = '🚀 Confirmar Agendamento';
        }
      } catch (err) {
        console.error('Erro na submissão:', err);
        statusMsg.style.color = '#ef4444';
        statusMsg.textContent = 'Erro de conexão com o servidor.';
        btnSubmit.disabled = false;
        btnSubmit.textContent = '🚀 Confirmar Agendamento';
      }
    });

    // Inicialização
    buscarHorariosOcupados(hoje);
  </script>

</body>
</html>
