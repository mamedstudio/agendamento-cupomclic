<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento VIP - CupomClic</title>
  <style>
    :root {
      --bg-color: #0d131f;
      --card-bg: #161f30;
      --accent-blue: #2563eb;
      --accent-blue-hover: #1d4ed8;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --border: #243044;
      --green: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 30px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 24px;
      text-align: center;
      margin-top: 0;
      margin-bottom: 6px;
    }

    p.subtitulo {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="date"],
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select {
      width: 100%;
      padding: 14px;
      background-color: #0d131f;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-blue);
    }

    .grid-horarios {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .btn-horario {
      padding: 12px 6px;
      background-color: #0d131f;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-horario:hover:not(:disabled) {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .btn-horario.ocupado {
      background-color: #161f30;
      color: #475569;
      text-decoration: line-through;
      border-color: #161f30;
      cursor: not-allowed;
      opacity: 0.5;
    }

    /* CARD UX DA SELEÇÃO */
    .card-selecionado {
      background-color: #0d131f;
      border: 1px solid var(--green);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .card-selecionado .info-data {
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-selecionado .info-destaque {
      font-size: 16px;
      font-weight: bold;
      color: var(--green);
      margin-top: 2px;
    }

    .btn-alterar {
      background: #243044;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    #secaoFormulario {
      display: none;
    }

    .box-lgpd {
      margin-top: 15px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
    }

    .box-lgpd input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-blue);
      cursor: pointer;
      margin-top: 2px;
    }

    .box-lgpd label {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 0;
      cursor: pointer;
    }

    .box-lgpd a {
      color: #38bdf8;
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background-color: var(--accent-blue);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background-color: var(--accent-blue-hover);
    }

    .btn-submit:disabled {
      background-color: #243044;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .version-footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 20px;
    }

    .status-msg {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚀 Reunião VIP CupomClic</h1>
    <p class="subtitulo">Agende sua sessão individual de suporte</p>

    <!-- ETAPA 1: SELEÇÃO DE DATA E HORÁRIO -->
    <div id="secaoSelecao">
      <div class="form-group">
        <label for="dataInput">Selecione a Data:</label>
        <input type="date" id="dataInput">
      </div>

      <div class="form-group">
        <label>Horários Disponíveis:</label>
        <div id="gridHorarios" class="grid-horarios"></div>
      </div>
    </div>

    <!-- ETAPA 2: FORMULÁRIO -->
    <div id="secaoFormulario">
      <div class="card-selecionado">
        <div>
          <div class="info-data">Horário Selecionado:</div>
          <div class="info-destaque" id="txtResumoSelecao">--/-- às --:--</div>
        </div>
        <button class="btn-alterar" type="button" onclick="alterarHorario()">✏️ Alterar</button>
      </div>

      <form id="formAgendamento">
        <div class="form-group">
          <label for="nome">Nome Completo:</label>
          <input type="text" id="nome" required placeholder="Seu nome">
        </div>

        <div class="form-group">
          <label for="loja">Nome da Sua Loja:</label>
          <input type="text" id="loja" required placeholder="Nome da loja">
        </div>

        <div class="form-group">
          <label for="whatsapp">WhatsApp com DDD:</label>
          <input type="tel" id="whatsapp" required placeholder="Ex: 14999998888">
        </div>

        <div class="form-group">
          <label for="email">E-mail comercial:</label>
          <input type="email" id="email" required placeholder="seuemail@exemplo.com">
        </div>

        <div class="form-group">
          <label for="funcao">Qual sua função na loja?</label>
          <select id="funcao" required>
            <option value="">Selecione...</option>
            <option value="Proprietário(a) / Sócio(a)">Proprietário(a) / Sócio(a)</option>
            <option value="Gerente de Marketing / Vendas">Gerente de Marketing / Vendas</option>
            <option value="Outro">Outro</option>
          </select>
        </div>

        <div class="box-lgpd">
          <input type="checkbox" id="aceiteTermos" required>
          <label for="aceiteTermos">
            Concordo com o uso dos meus dados para o agendamento e suporte, conforme os <a href="/termos.html" target="_blank">Termos e Condições</a>.
          </label>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
          ⚡ Confirmar Agendamento VIP
        </button>
      </form>
    </div>

    <div id="statusMsg" class="status-msg"></div>

    <!-- MUDANÇA DE VERSÃO PARA CONFIRMAÇÃO DO DEPLOY -->
    <div class="version-footer">
      Versão: <b>v1.0.5 - Meet UX</b>
    </div>
  </div>

  <script>
    const HORARIOS_PADRAO = ['09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00'];

    const dataInput = document.getElementById('dataInput');
    const gridHorarios = document.getElementById('gridHorarios');
    const secaoSelecao = document.getElementById('secaoSelecao');
    const secaoFormulario = document.getElementById('secaoFormulario');
    const txtResumoSelecao = document.getElementById('txtResumoSelecao');
    const statusMsg = document.getElementById('statusMsg');
    const form = document.getElementById('formAgendamento');

    let horaSelecionada = null;

    const hoje = new Date().toISOString().split('T')[0];
    dataInput.value = hoje;
    dataInput.min = hoje;

    async function buscarHorariosOcupados(dataStr) {
      gridHorarios.innerHTML = '<div style="grid-column: span 3; text-align: center; color: #94a3b8; font-size: 13px;">Buscando horários...</div>';
      
      try {
        const res = await fetch(`/api/agendar?data=${dataStr}`);
        const data = await res.json();
        const ocupados = data.ocupados || [];

        gridHorarios.innerHTML = '';

        HORARIOS_PADRAO.forEach(hora => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn-horario';
          btn.textContent = hora;

          if (ocupados.includes(hora)) {
            btn.classList.add('ocupado');
            btn.disabled = true;
          } else {
            btn.onclick = () => selecionarHorario(dataStr, hora);
          }

          gridHorarios.appendChild(btn);
        });

      } catch (err) {
        gridHorarios.innerHTML = '<div style="grid-column: span 3; text-align: center; color: #ef4444; font-size: 13px;">Erro ao carregar horários.</div>';
      }
    }

    function selecionarHorario(dataStr, hora) {
      horaSelecionada = hora;
      const partes = dataStr.split('-');
      txtResumoSelecao.textContent = `${partes[2]}/${partes[1]}/${partes[0]} às ${hora}h`;

      secaoSelecao.style.display = 'none';
      secaoFormulario.style.display = 'block';
    }

    function alterarHorario() {
      horaSelecionada = null;
      secaoFormulario.style.display = 'none';
      secaoSelecao.style.display = 'block';
    }

    dataInput.addEventListener('change', (e) => {
      buscarHorariosOcupados(e.target.value);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const btnSubmit = document.getElementById('btnSubmit');
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Agendando...';
      statusMsg.textContent = '';

      const payload = {
        data: dataInput.value,
        hora: horaSelecionada,
        nome: document.getElementById('nome').value,
        loja: document.getElementById('loja').value,
        whatsapp: document.getElementById('whatsapp').value,
        email: document.getElementById('email').value,
        funcao: document.getElementById('funcao').value
      };

      try {
        const response = await fetch('/api/agendar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          window.location.href = result.meetLink;
        } else {
          statusMsg.style.color = '#ef4444';
          statusMsg.textContent = result.error || 'Erro ao agendar.';
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '⚡ Confirmar Agendamento VIP';
        }
      } catch (err) {
        statusMsg.style.color = '#ef4444';
        statusMsg.textContent = 'Erro de conexão.';
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '⚡ Confirmar Agendamento VIP';
      }
    });

    buscarHorariosOcupados(hoje);
  </script>

</body>
</html>
