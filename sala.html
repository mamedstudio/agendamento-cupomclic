<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reunião VIP - CupomClic</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: #1e293b;
      padding: 40px 25px;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      border: 1px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .logo { 
      font-size: 32px; 
      font-weight: 800; 
      margin-bottom: 8px; 
    }
    .subtitulo { 
      color: #38bdf8; 
      font-size: 18px; 
      font-weight: 600;
      margin-bottom: 30px; 
    }
    
    .btn-entrar {
      display: block;
      width: 100%;
      background-color: #22c55e;
      color: #ffffff;
      padding: 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: bold;
      font-size: 20px;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
      cursor: pointer;
      border: none;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-entrar:active {
      background-color: #16a34a;
      transform: scale(0.97);
    }

    .dica-mobile {
      font-size: 16px;
      color: #cbd5e1;
      margin-top: 25px;
      line-height: 1.5;
      font-weight: 400;
      background-color: #0f172a;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    /* Mensagem grande de confirmação */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #22c55e;
      color: #ffffff;
      padding: 20px 30px;
      border-radius: 16px;
      font-weight: bold;
      font-size: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: none;
      z-index: 1000;
      width: 85%;
      max-width: 350px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">🚀 CupomClic</div>
    <div class="subtitulo">Sua Reunião VIP está pronta!</div>

    <button class="btn-entrar" id="btnEntrar" onclick="acessarSala()">
      👉 ENTRAR NA REUNIÃO
    </button>

    <div class="dica-mobile">
      💡 <b>Dica rápida:</b> O código de acesso é copiado automaticamente ao clicar. Se o aplicativo pedir, basta <b>colar</b> na tela.
    </div>
  </div>

  <div id="toast" class="toast">
    📋 Código copiado!<br>Abrindo a reunião...
  </div>

  <script>
    const CODIGO_SALA = 'nco-fgqq-ucz';
    const URL_MEET = 'https://meet.google.com/nco-fgqq-ucz';

    async function acessarSala() {
      // 1. Copia o código da sala de forma transparente
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(CODIGO_SALA);
        } else {
          // Fallback para aparelhos antigos
          const textArea = document.createElement("textarea");
          textArea.value = CODIGO_SALA;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
        }
      } catch (err) {
        console.log('Não foi possível copiar automaticamente:', err);
      }

      // 2. Exibe o aviso grande no centro
      const toast = document.getElementById('toast');
      toast.style.display = 'block';

      // 3. Redireciona para o Google Meet
      setTimeout(() => {
        window.location.href = URL_MEET;
      }, 700);
    }
  </script>

</body>
</html>
