<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reunião VIP - CupomClic</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 420px;
      width: 100%;
      border: 1px solid #334155;
    }
    .logo {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .subtitulo {
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 25px;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border-left-color: #22c55e;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .btn-entrar {
      display: block;
      width: 100%;
      background-color: #22c55e;
      color: #ffffff;
      padding: 16px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      margin-top: 15px;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
      transition: background-color 0.2s;
    }
    .btn-entrar:active {
      background-color: #16a34a;
    }
    .dica-mobile {
      font-size: 12px;
      color: #64748b;
      margin-top: 15px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">🚀 CupomClic</div>
    <div class="subtitulo">Conectando você à sua Reunião VIP...</div>
    
    <div class="spinner"></div>

    <a id="link-meet" class="btn-entrar" href="https://meet.google.com/nco-fgqq-ucz" target="_top">
      👉 TOQUE AQUI PARA ENTRAR
    </a>

    <div class="dica-mobile">
      Se a sala não abrir automaticamente em 2 segundos, toque no botão verde acima.
    </div>
  </div>

  <script>
    // Link direto e limpo do Google Meet
    const SALA_MEET = 'https://meet.google.com/nco-fgqq-ucz';

    const btnMeet = document.getElementById('link-meet');
    btnMeet.href = SALA_MEET;

    // Tenta o redirecionamento automático
    setTimeout(() => {
      try {
        window.location.replace(SALA_MEET);
      } catch (e) {
        console.log("Aguardando toque do usuário no celular.");
      }
    }, 1500);
  </script>

</body>
</html>
