<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrando na Reunião - CupomClic</title>
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 400px;
      width: 100%;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border-left-color: #22c55e;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .btn-entrar {
      display: inline-block;
      background-color: #22c55e;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🚀 CupomClic</h2>
    <p>Sua Reunião VIP está pronta!</p>
    <div class="spinner"></div>
    <a id="link-meet" class="btn-entrar" href="#">Clique aqui para Entrar no Meet</a>
  </div>

  <script>
    // Link direto da sala
    const SALA_MEET = 'https://meet.google.com/nco-fgqq-ucz';

    const linkElem = document.getElementById('link-meet');
    linkElem.href = SALA_MEET;

    // Redirecionamento direto
    setTimeout(() => {
      window.location.replace(SALA_MEET);
    }, 1200);
  </script>
</body>
</html>
