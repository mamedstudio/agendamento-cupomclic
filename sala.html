<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reunião VIP - CupomClic</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background-color: #1e293b;
      padding: 30px 20px;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .logo { font-size: 26px; font-weight: bold; margin-bottom: 6px; }
    .subtitulo { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
    
    .btn-entrar {
      display: block;
      width: 100%;
      background-color: #22c55e;
      color: #ffffff;
      padding: 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 15px;
    }

    .box-codigo {
      background-color: #0f172a;
      border: 1px dashed #334155;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
    }
    .codigo-txt {
      font-family: monospace;
      font-size: 18px;
      color: #38bdf8;
      font-weight: bold;
      letter-spacing: 1px;
      margin: 5px 0;
    }
    .btn-copiar {
      background: #334155;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">🚀 CupomClic</div>
    <div class="subtitulo">Sua Reunião VIP está pronta</div>

    <a class="btn-entrar" href="https://meet.google.com/nco-fgqq-ucz" target="_blank" rel="noopener noreferrer">
      👉 ENTRAR NA REUNIÃO
    </a>

    <div class="box-codigo">
      <div style="font-size: 12px; color: #94a3b8;">Se o app pedir o código da reunião:</div>
      <div class="codigo-txt" id="codigoSala">nco-fgqq-ucz</div>
      <button class="btn-copiar" onclick="copiarCodigo()">📋 Copiar Código</button>
    </div>
  </div>

  <script>
    function copiarCodigo() {
      navigator.clipboard.writeText('nco-fgqq-ucz');
      alert('Código nco-fgqq-ucz copiado com sucesso!');
    }
  </script>

</body>
</html>
