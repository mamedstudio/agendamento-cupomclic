<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reunião VIP - CupomClic</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 420px;
      width: 100%;
      border: 1px solid #334155;
    }
    .logo {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .subtitulo {
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 25px;
    }
    .btn-entrar {
      display: block;
      width: 100%;
      background-color: #22c55e;
      color: #ffffff;
      padding: 18px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-entrar:active {
      background-color: #16a34a;
      transform: scale(0.98);
    }
    .dica-mobile {
      font-size: 13px;
      color: #64748b;
      margin-top: 20px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">🚀 CupomClic</div>
    <div class="subtitulo">Sua Reunião VIP está pronta!</div>

    <a class="btn-entrar" href="https://meet.google.com/nco-fgqq-ucz" target="_blank" rel="noopener noreferrer">
      👉 TOQUE AQUI PARA ENTRAR
    </a>

    <div class="dica-mobile">
      Toque no botão acima para acessar a sala de reunião no seu navegador.
    </div>
  </div>

</body>
</html>
